<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5fbf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="원자재실사">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>진천2 원자재 실사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <div class="wrap">
    <div class="top"><h1>진천2 원자재 실사</h1><div class="right"><select id="monthSel" class="month" aria-label="조사월"><option>불러오는 중</option></select><div class="subrow"><a class="formlink" href="wip.html">재공품 →</a><span class="adm" id="admBadge" hidden>관리자</span><span class="sync" id="sync"></span><button type="button" class="bigbtn" id="bigBtn" aria-pressed="false" aria-label="글자 크게">가<b>+</b></button></div></div></div>
    <div class="locs" id="locBar" role="group" aria-label="조사 장소"></div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-input" aria-selected="true">입력</button>
    <button class="tab" role="tab" id="tab-log" aria-selected="false">입력 내역</button>
    <button class="tab" role="tab" id="tab-all" aria-selected="false">전체</button>
  </div>
</header>

<main class="wrap">
  <div id="banners"></div>
  <section id="view-input">
    <div id="lockBar1"></div>
    <div class="search">
      <input id="q" type="search" placeholder="규격·길이·품목코드 검색 (예: 250 4820)" autocomplete="off">
      <button type="button" id="grpBtn" class="grpbtn" aria-haspopup="dialog" aria-label="품목군 고르기">전체 품목군<span aria-hidden="true">▾</span></button>
    </div>
    <div class="filters">
      <button class="chip" id="f-all" aria-pressed="true">전체</button>
      <button class="chip" id="f-todo" aria-pressed="false">이 장소 미입력</button>
      <button class="chip" id="f-done" aria-pressed="false">이 장소 입력됨</button>
    </div>
    <div id="itemList"></div>
    <button class="addcustom" id="addCustom">＋ 목록에 없는 품목 입력 (당월 추가품목)</button>
  </section>
  <section id="view-log" hidden>
    <div id="lockBar2"></div>
    <div class="search">
      <input id="lq" type="search" placeholder="품목·입력자·메모 검색" autocomplete="off">
    </div>
    <div class="filters"><button class="chip" id="showDel" aria-pressed="false">삭제한 기록도 보기</button></div>
    <div class="log" id="logList"></div>
  </section>
  <!-- 전체: 구역과 상관없이 모든 입력을 본다 (보기 전용) -->
  <section id="view-all" hidden>
    <div class="seg" role="group" aria-label="전체 보기">
      <button class="chip" id="seg-items" aria-pressed="true">전체 입력값</button>
      <button class="chip" id="seg-log" aria-pressed="false">전체 입력 내역</button>
      <button class="chip" id="seg-cmp" aria-pressed="false" hidden>비교</button>
      <button class="chip" id="seg-sum" aria-pressed="false">집계</button>
    </div>
    <div id="all-items">
      <div class="search"><input id="iq" type="search" placeholder="규격·길이·품목코드 검색" autocomplete="off"></div>
      <div class="filters">
        <button class="chip" id="af-done" aria-pressed="true">입력된 품목만</button>
        <button class="chip" id="af-all" aria-pressed="false">모든 품목</button>
      </div>
      <div id="allItemList" class="allitems"></div>
    </div>
    <div id="all-log" hidden>
      <div class="search">
        <input id="aq" type="search" placeholder="품목·입력자·메모 검색" autocomplete="off">
        <select id="lloc" aria-label="장소"><option value="">모든 장소</option></select>
      </div>
      <div class="filters"><button class="chip" id="showDelA" aria-pressed="false">삭제한 기록도 보기</button></div>
      <div class="log" id="allLogList"></div>
    </div>
    <div id="all-cmp" hidden>
      <div class="search">
        <input id="cq" type="search" placeholder="규격·길이 검색" autocomplete="off">
        <select id="cloc" aria-label="장소"><option value="">모든 장소</option></select>
      </div>
      <div class="filters">
        <button class="chip" id="cf-big" aria-pressed="true">차이 큰 것</button>
        <button class="chip" id="cf-in" aria-pressed="false">입고 품목</button>
        <button class="chip" id="cf-all" aria-pressed="false">전체</button>
      </div>
      <div class="filters">
        <button class="chip" id="cs-all" aria-pressed="true">± 모두</button>
        <button class="chip" id="cs-plus" aria-pressed="false">+ 실사가 많음</button>
        <button class="chip" id="cs-minus" aria-pressed="false">− 실사가 적음</button>
      </div>
      <div class="filters">
        <button class="chip" id="co-diff" aria-pressed="true">차이 큰 순</button>
        <button class="chip" id="co-item" aria-pressed="false">품목 순</button>
      </div>
      <div class="sum" id="cmpView"></div>
    </div>
    <div id="all-sum" hidden>
      <div class="sum" id="sumView"></div>
    </div>
  </section>
</main>

<div id="sheetRoot"></div>
<div id="dlgRoot"></div>
<div id="grpRoot"></div>
<div id="visRoot"></div>
<div id="toastRoot"></div>


<div class="setup" id="setup" hidden>
  <form id="setupForm" autocomplete="off">
    <h2>진천2 원자재 실사</h2>
    <p>처음 한 번만 입력하면 이 폰에 기억됩니다. 입력 기록에 이름이 함께 남습니다.</p>
    <div id="setStep1"><label>현장 코드<input id="setCode" inputmode="numeric" maxlength="12" placeholder="관리자에게 받은 숫자"></label></div>
    <div id="setStep2" hidden>
      <div class="set-title">내 이름을 고르세요 <small id="setMon"></small></div>
      <div class="names" id="setNames"></div>
      <label id="setNameWrap" hidden>이름 직접 입력<input id="setName" maxlength="20" placeholder="예: 김민수"></label>
      <label id="setPinWrap" hidden>PIN<input id="setPin" type="password" inputmode="numeric" maxlength="8" placeholder="관리자에게 받은 숫자 4자리" autocomplete="off"></label>
    </div>
    <div class="err" id="setErr"></div>
    <button class="btn" type="submit" id="setBtn">다음</button>
    <button class="linkbtn" type="button" id="setBack" hidden>현장 코드 다시 입력</button>
  </form>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
